server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/second_hand_trading?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "@Sbz8863564,."
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.trading.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT 配置
jwt:
  secret: Y2xhdWQtc2Vjb25kLWhhbmQtdHJhZGluZy1wbGF0Zm9ybS1zZWNyZXQta2V5LTIwMjY=
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# 缓存 TTL 配置（秒）
app:
  cache:
    product-list-ttl: 600
    product-detail-ttl: 1800
    category-ttl: 3600
    stats-ttl: 300
  upload:
    dir: ./uploads

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.trading: DEBUG
    org.springframework.security: DEBUG
